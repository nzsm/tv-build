# ============================================================
# 云编译 TVBoxOS 定制 APK —— 精简版（v2）
# 本版改动（相对仓库里那一版）：
#   ① 删掉原来的第 7 步 tvbox_optimize.py（它注入的 DNS 与广告，全部被 tvbox_ext.py 覆盖，纯白做；
#      它唯一有用的 DoH 失败回退，已经并进 tvbox_ext.py v58，删掉不丢功能）
#   ② 加了 3 条"脚本版本守卫"：仓库里要是又放了旧的 tvbox_ext.py，20 秒内直接失败并写明原因，
#      不会再跑 40 分钟 gradle 才在 AdBlocker.java 上报 missing return statement
#   ③ 步骤重新编号 1~13，其余逻辑与旧版逐字一致（签名、artifact、回写 apk/、失败写 ci-error.log 都没动）
#   ④ 编译只加 --build-cache（复用缓存）；不加 -x lint 之类的排除参数——Gradle 对不存在的任务名会直接报错
# 用法：覆盖仓库 .github/workflows/build-apk.yml，然后 Actions 页 Run workflow
# ============================================================
name: 云编译 TVBoxOS 定制 APK

on:
  workflow_dispatch:
    inputs:
      default_url:
        description: '内置默认订阅地址（留空=自动用 你的用户名/tv-src/main/sub/main.json）'
        required: false
        default: ''
      app_name:
        description: 'APP 显示名称（留空=NZ）'
        required: false
        default: 'NZ'

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    name: 编译 arm64 定制版
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      - name: 2. 拉取 TVBoxOS 最新源码
        run: |
          git clone --depth 1 --branch main https://github.com/q215613905/TVBoxOS.git tvboxos-src
          echo "--- 源码结构 ---"
          ls tvboxos-src | head -20

      - name: 3. 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 4. 安装 Python 3.9（chaquo 交叉编译必需）
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 5. 安装 Gradle（用 wrapper 版本）
        uses: gradle/actions/setup-gradle@v4

      - name: 6. 应用版本号 + local.properties + 编译内存
        working-directory: tvboxos-src
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${TAG}\'#" app/build.gradle || true
          grep -n "versionName" app/build.gradle | head -3 || true
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          else
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi
          cat local.properties
          sed -i 's#buildPython("D:[^"]*")#buildPython("python")#g' pyramid/build.gradle || true
          grep -n "buildPython" pyramid/build.gradle || echo "（pyramid 无 buildPython 行）"
          if [ -f gradle.properties ]; then
            sed -i '/^org.gradle.jvmargs/d' gradle.properties || true
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" > gradle.properties
          fi
          echo "org.gradle.caching=true" >> gradle.properties
          cat gradle.properties

      - name: 7. 注入定制增强（DNS + 广告 + 内置订阅 + APP 名称）
        env:
          IN_URL: ${{ github.event.inputs.default_url }}
          IN_NAME: ${{ github.event.inputs.app_name }}
        run: |
          DEF_URL="${IN_URL}"
          if [ -z "${DEF_URL}" ]; then
            DEF_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/tv-src/main/sub/main.json"
          fi
          APP_NAME="${IN_NAME}"
          if [ -z "${APP_NAME}" ]; then
            APP_NAME="NZ"
          fi
          echo "内置订阅: ${DEF_URL}"
          echo "APP 名称: ${APP_NAME}"
          set +e
          python3 -u tvbox_ext.py tvboxos-src "${DEF_URL}" "${APP_NAME}" 2>&1 | tee /tmp/ext.log
          EXT_EXIT=${PIPESTATUS[0]}
          echo "=== 增强脚本退出码: ${EXT_EXIT} ==="
          if [ ${EXT_EXIT} -ne 0 ]; then
            echo "增强脚本执行失败，终止以便回写日志"
            exit ${EXT_EXIT}
          fi

          echo "--- 脚本版本守卫（防旧版脚本再编译一次白跑）---"
          J=tvboxos-src/app/src/main/java/com/github/tvbox/osc
          FAIL=0
          grep -q 'return AD_HOSTS.isEmpty();' "$J/util/AdBlocker.java" \
            || { echo "!!! AdBlocker.java 里 isEmpty() 没有 return —— 仓库的 tvbox_ext.py 是旧版，先更新成最新版"; FAIL=1; }
          grep -q 'public static boolean enabled()' "$J/util/AdBlocker.java" \
            || { echo "!!! AdBlocker.java 缺 enabled() 总开关，去广告开关会失效 —— 脚本是旧版"; FAIL=1; }
          grep -q 'Dns.SYSTEM.lookup(hostname)' "$J/util/OkGoHelper.java" \
            || { echo "!!! OkGoHelper 缺 DoH 失败回退（设了 DNS 会搜不到）—— 脚本是旧版"; FAIL=1; }
          [ -f "$J/util/BuiltinAdRules.java" ] || { echo "!!! 没生成 BuiltinAdRules.java"; FAIL=1; }
          [ -f "$J/util/AdRuleUpdater.java" ] || { echo "!!! 没生成 AdRuleUpdater.java（广告规则就不会自动更新）"; FAIL=1; }
          grep -q '<string name="app_name">TVBox</string>' tvboxos-src/app/src/main/res/values/strings.xml \
            && { echo "!!! 应用名还是 TVBox —— APP_NAME 没写进去，脚本是旧版"; FAIL=1; }
          [ ${FAIL} -ne 0 ] && { echo "版本守卫未通过，直接停止，别浪费 40 分钟编译"; exit 1; }
          echo "版本守卫通过：脚本是最新版（含应用名注入）"
          echo "--- 关键改动核对 ---"
          grep -n 'HawkConfig.API_URL, "http' "$J/api/ApiConfig.java" | head -3 || true
          grep -n 'name="app_name"' tvboxos-src/app/src/main/res/values/strings.xml || true

      - name: 8. 编译 arm64 变体（python64）
        working-directory: tvboxos-src
        run: |
          chmod +x gradlew
          echo "=== 环境自检 ==="
          java -version 2>&1 | head -2
          python3 --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -d ${ANDROID_HOME}/ndk/* 2>/dev/null || echo "（未发现 NDK 目录）"
          echo "=== 编译 python64（arm64），低并行防 OOM ==="
          ./gradlew assemblePython64Release --no-daemon --max-workers=2 --build-cache --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== 编译退出码: ${EXIT_CODE} ==="
          if [ ${EXIT_CODE} -ne 0 ]; then
            {
              echo "## 编译失败（exit ${EXIT_CODE}）"
              echo ""
              echo "### 1) gradle What went wrong"
              echo '```'
              grep -n -A 30 "What went wrong" /tmp/gradle.log | head -70 || echo "（无此段）"
              echo '```'
              echo "### 2) 关键错误行"
              echo '```'
              grep -n -i "error:\|FAILURE:\|cannot find symbol\|failed to\|could not\|No such file" /tmp/gradle.log | head -60 || echo "（无）"
              echo '```'
              echo "### 3) 日志尾部 60 行"
              echo '```'
              tail -n 60 /tmp/gradle.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            tail -80 /tmp/gradle.log
            exit 1
          fi

      - name: 9. 收集 APK（只收 release 产物）
        run: |
          set -e
          mkdir -p apk-out
          FOUND=0
          for f in $(find tvboxos-src/app/build/outputs -name "*.apk" 2>/dev/null | grep -i "release"); do
            cp "$f" "apk-out/$(basename "$f")"
            FOUND=1
          done
          echo "找到 APK 数量: ${FOUND}"
          ls -la apk-out/
          if [ ${FOUND} -eq 0 ]; then
            echo "!!! 没有找到编译产物"; exit 1
          fi

      - name: 9.5 产物自检（应用名 / 图标 / 版本 / 包名）
        env:
          IN_NAME: ${{ github.event.inputs.app_name }}
        run: |
          set -e
          exec > >(tee /tmp/apkcheck.log) 2>&1
          BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | tail -1)
          A2="${BT}aapt2"
          WANT="${IN_NAME:-NZ}"
          FAIL=0
          for f in apk-out/*.apk; do
            [ -f "$f" ] || continue
            echo "=== 自检 $f ==="
            "$A2" dump badging "$f" > /tmp/bdg.txt 2>/dev/null || { echo "!!! aapt2 dump badging 失败"; FAIL=1; continue; }
            grep -m1 "package:" /tmp/bdg.txt || true
            grep -m1 "application-label" /tmp/bdg.txt || true
            grep -m1 "application-icon-480" /tmp/bdg.txt || true
            grep -m1 "launchable-activity" /tmp/bdg.txt || true
            grep -q "application-label:'${WANT}'" /tmp/bdg.txt && echo "应用名 OK：${WANT}" || { echo "!!! 应用名不是 ${WANT}（见上面 application-label）"; FAIL=1; }
            # 注意：release 包里资源文件名被压缩成 res/XX.xml，badging 的 application-icon 只是文件路径，
            #       永远查不到 "ic_launcher" 字样；验证图标必须回到资源表按资源名查，否则必然误判。
            "$A2" dump resources "$f" 2>/dev/null | grep -q "mipmap/ic_launcher" && echo "桌面图标 OK：mipmap/ic_launcher" || { echo "!!! 资源表里没有 mipmap/ic_launcher（启动图标没进包）"; FAIL=1; }
            grep -q "application-icon-" /tmp/bdg.txt && echo "清单 icon 已指向图标资源" || { echo "!!! manifest 没有 application-icon"; FAIL=1; }
            ls -l "$f"
          done
          [ ${FAIL} -ne 0 ] && { echo "产物自检未通过，签名前直接停止"; exit 1; }
          echo "产物自检通过"

      - name: 10. 正式签名 + 验签
        env:
          KS_PASS: "${{ secrets.KEYSTORE_PASS || 'tvbox2026' }}"
        run: |
          set -e
          KS="keystore/tvbox.keystore"
          if [ -f "$KS" ]; then
            echo "发现 keystore，开始正式签名..."
            BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | tail -1)
            ZA="${BT}zipalign"
            APKS="${BT}apksigner"
            for f in apk-out/*.apk; do
              [ -f "$f" ] || continue
              echo "签名中: $f"
              "$ZA" -f 4 "$f" "$f.align"
              "$APKS" sign --ks "$KS" --ks-pass pass:${KS_PASS} --key-pass pass:${KS_PASS} --out "$f.signed" "$f.align"
              mv -f "$f.signed" "$f"
              rm -f "$f.align"
              "$APKS" verify "$f" || { echo "!!! 签名验证失败: $f"; exit 1; }
              echo "签名验证通过: $f"
            done
          else
            echo "仓库无 keystore/tvbox.keystore，使用原始签名（安装前需卸载旧版）"
          fi

      - name: 11. 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-APK-定制版
          path: apk-out/*
          if-no-files-found: error

      - name: 12. git 回写 apk/ 目录
        run: |
          set -e
          TOKEN="${{ github.token }}"
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin
          git reset --hard "origin/${BRANCH}"
          mkdir -p apk
          BASE=$(ls apk-out/*.apk | head -1 | xargs basename)
          FN="${BASE%.apk}_${TAG:-manual}.apk"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/apk/${FN}"
          PAGES="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/apk/${FN}"
          printf '最新 APK（手机浏览器打开即下载）：\n%s\n备用链接：\n%s\n' "${RAW}" "${PAGES}" > apk/下载链接.txt
          rm -f apk/*.apk
          rm -f ci-error.log
          rm -f tk-step-fail.txt
          cp apk-out/*.apk "apk/${FN}"
          ls -la apk/
          git add -A apk/ || true
          git add -A ci-error.log tk-step-fail.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "apk 无变化，跳过提交"
            exit 0
          fi
          git commit -m "云编译定制 APK 更新 ${TAG:-}"
          git push origin "HEAD:${BRANCH}"
          echo "--- 完成，apk/ 已更新 ---"

      - name: 13. 失败时把编译日志回写仓库（便于远程读取）
        if: failure()
        run: |
          set +e
          TOKEN="${{ github.token }}"
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin || true
          git reset --hard "origin/${BRANCH}" || true
          {
            echo "# CI 失败日志  $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "## 环境"
            java -version 2>&1 | head -3
            python3 --version
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            ls -d ${ANDROID_HOME}/ndk/* 2>/dev/null | head -3
            echo
            echo "## 复现自检（源码目录状态）"
            ls -l tvboxos-src/gradlew 2>/dev/null
            head -3 tvboxos-src/gradlew 2>/dev/null
            cat tvboxos-src/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | tail -4
            cat tvboxos-src/local.properties 2>/dev/null
            tail -4 tvboxos-src/gradle.properties 2>/dev/null
            echo
            echo "## 增强脚本输出（最后 120 行）"
            echo '```'
            tail -n 120 /tmp/ext.log 2>/dev/null
            echo '```'
            echo
            echo "## 产物与自检痕迹"
            ls -l apk-out 2>/dev/null
            echo '```'
            tail -n 60 /tmp/apkcheck.log 2>/dev/null
            echo '```'
            echo
            echo "## gradle: What went wrong"
            grep -A 40 "What went wrong" /tmp/gradle.log 2>/dev/null | head -70
            echo
            echo "## 关键错误行"
            grep -n -i "error:\|FAILURE:\|cannot find symbol\|Could not\|Cause:\|Exception" /tmp/gradle.log 2>/dev/null | head -50
            echo
            echo "## 日志尾部 350 行"
            echo '```'
            tail -n 350 /tmp/gradle.log 2>/dev/null
            echo '```'
          } > ci-error.log 2>&1
          wc -l ci-error.log
          head -20 ci-error.log
          git add -f ci-error.log 2>/dev/null || true
          [ -f tk-step-fail.txt ] && git add -f tk-step-fail.txt
          git commit -m "CI 失败日志 $(date -u '+%Y%m%d-%H%M%S')" || echo "（无变化）"
          git push origin "HEAD:${BRANCH}" 2>&1 | tail -5
